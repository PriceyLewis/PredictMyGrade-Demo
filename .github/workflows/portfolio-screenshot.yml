name: Refresh portfolio screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portfolio-screenshot.yml"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: predictmygrade-portfolio-screenshot
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve verified CI run
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$WORKFLOW_RUN_ID" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
          else
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID"
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download visual review artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          ARTIFACT_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("visual-review-")) | .id' | head -n 1)"
          test -n "$ARTIFACT_ID"
          mkdir -p /tmp/visual-review
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/visual-review.zip
          unzip -q /tmp/visual-review.zip -d /tmp/visual-review

      - name: Promote real Playwright screenshot
        run: |
          SOURCE="$(find /tmp/visual-review -type f -name 'login-1440-dark.png' -print -quit)"
          test -n "$SOURCE"
          mkdir -p docs/screenshots
          cp "$SOURCE" docs/screenshots/predictmygrade-login-dark.png

      - name: Commit screenshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/predictmygrade-login-dark.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh verified PredictMyGrade screenshot [skip ci]"
          git pull --rebase origin main
          git push
