name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Django configuration and migration state
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-django-deploy-checks
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_DEBUG: "true"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-django-tests
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_DEBUG: "true"
        run: python manage.py test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload desktop and mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.sha }}
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7
